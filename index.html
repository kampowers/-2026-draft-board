function jjCalloutFor(name){return JJ_CALLOUTS[name]||''}
function emblemsFor(name){let callout=jjCalloutFor(name),emblems=[];if(callout){let mark=JJ_EMBLEMS[callout];emblems.push('<span class="jj-emblem jj-'+callout+'" role="img" aria-label="'+mark.label+'" title="'+mark.label+'">'+mark.symbol+'</span>')}if(SILVA_FADES[name])emblems.push('<span class="jj-emblem jj-fade silva-fade" role="img" aria-label="Silva fade" title="Silva fade">−</span>');if(EXODIA_PLAYERS[name])emblems.push('<span class="jj-emblem exodia-emblem" role="img" aria-label="Exodia" title="Exodia">⚡</span>');return emblems.join('')}
const CONNECTED_DRAFT_KEY='draftBoard2026:connectedSleeperDraft';
let SLEEPER_DRAFT_ID=localStorage.getItem(CONNECTED_DRAFT_KEY)||'';
const DRAFT_STATE_KEY='mobileDraft2026:v17:'+SLEEPER_DRAFT_ID;
const SLEEPER_STATE_KEY='sleeperDraft2026:v17:'+SLEEPER_DRAFT_ID;
function parseDraftId(value){let text=String(value||'').trim(),match=text.match(/(?:drafts?|draft)(?:\/[^/?#]+)*\/([0-9]{8,})(?:[/?#]|$)/i)||text.match(/^([0-9]{8,})$/);return match?match[1]:''}
function updateDraftControls(){let details=document.getElementById('draftConnection'),summary=document.getElementById('draftSummary'),input=document.getElementById('draftUrl'),connect=document.getElementById('connectBtn'),disconnect=document.getElementById('disconnectBtn');if(!input)return;input.value=SLEEPER_DRAFT_ID;connect.textContent=SLEEPER_DRAFT_ID?'Change':'Connect';disconnect.hidden=!SLEEPER_DRAFT_ID;details.open=!SLEEPER_DRAFT_ID;summary.textContent=SLEEPER_DRAFT_ID?'Sleeper draft · connected':'Sleeper draft · connect'}
function connectDraft(){let input=document.getElementById('draftUrl'),button=document.getElementById('connectBtn'),id=parseDraftId(input&&input.value);if(!id){syncStatus('Paste a valid Sleeper draft link or numeric draft ID','warn');return}button.disabled=true;button.textContent='Checking…';fetch('https://api.sleeper.app/v1/draft/'+id+'?ts='+Date.now(),{cache:'no-store'}).then(function(response){if(!response.ok)throw new Error('Draft not found');return response.json()}).then(function(draft){if(String(draft.draft_id||'')!==id)throw new Error('Draft not found');localStorage.setItem(CONNECTED_DRAFT_KEY,id);location.reload()}).catch(function(error){button.disabled=false;button.textContent=SLEEPER_DRAFT_ID?'Change':'Connect';syncStatus('Not connected — '+error.message,'warn')})}
function disconnectDraft(){if(!SLEEPER_DRAFT_ID||!confirm('Disconnect this Sleeper draft? Your rankings and manual draft buttons will remain available.'))return;stopSleeperPickSync();stopSleeperStartWatch();localStorage.removeItem(CONNECTED_DRAFT_KEY);location.reload()}
function loadSleeperState(){try{return JSON.parse(localStorage.getItem(SLEEPER_STATE_KEY)||'{"drafted":[],"count":0}')}catch(error){return{drafted:[],count:0}}}
function saveSleeperState(){localStorage.setItem(SLEEPER_STATE_KEY,JSON.stringify({drafted:Array.from(sleeperDrafted),count:sleeperPickTotal}))}
let savedSleeperState=loadSleeperState();
let sleeperDrafted=new Set(savedSleeperState.drafted||[]);
let sleeperPickTotal=Number(savedSleeperState.count)||0;
let sleeperTeams=0;
function canonicalName(name){let value=String(name||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');if(value==='cameronward')return'camward';if(value==='nickolassingleton'||value==='nicholassingleton')return'nicksingleton';if(value==='kennygainwell')return'kennethgainwell';return value}
function sleeperPickKeys(pick){let meta=pick.metadata||{},position=String(meta.position||pick.position||'').toUpperCase(),isDefense=position==='DEF'||position==='DST'||position==='D/ST';return [canonicalName((meta.first_name||'')+' '+(meta.last_name||'')),isDefense?canonicalName((meta.team||'')+' DST'):''].filter(Boolean)}
function syncStatus(message,kind){let el=document.getElementById('sync');if(!el)return;el.className='sync'+(kind?' '+kind:'');el.textContent=message}
function setCurrentPick(overall){let el=document.getElementById('pick');if(!el)return;if(!overall||overall<1){el.textContent='Current pick: waiting for Sleeper…';return}if(sleeperTeams>0){let round=Math.floor((overall-1)/sleeperTeams)+1,slot=((overall-1)%sleeperTeams)+1;el.textContent='Current pick: '+round+'.'+String(slot).padStart(2,'0')+' · Overall '+overall;return}el.textContent='Current pick: Overall '+overall}
function isDrafted(i){return !!S.d[i]||sleeperDrafted.has(i)}
let sleeperDraftActive=false;
let sleeperSyncPaused=false;
let sleeperPickTimer=null;
let sleeperStartWatchTimer=null;
let sleeperPickRequestInFlight=false;
let sleeperPickRequestSequence=0;
let sleeperPickController=null;
let sleeperInitialSyncPending=!!SLEEPER_DRAFT_ID;
function stopSleeperPickSync(){if(sleeperPickTimer!==null){clearInterval(sleeperPickTimer);sleeperPickTimer=null}}
function stopSleeperStartWatch(){if(sleeperStartWatchTimer!==null){clearInterval(sleeperStartWatchTimer);sleeperStartWatchTimer=null}}
function startSleeperPickSync(){stopSleeperStartWatch();if(sleeperPickTimer===null)sleeperPickTimer=setInterval(syncSleeperPicks,1000)}
function startSleeperStartWatch(){if(sleeperStartWatchTimer===null)sleeperStartWatchTimer=setInterval(syncSleeperPicks,2000)}
function syncSleeperPicks(force){if(!SLEEPER_DRAFT_ID)return;if(sleeperPickRequestInFlight&&!force)return;if(force&&sleeperPickController)sleeperPickController.abort();let requestId=++sleeperPickRequestSequence,controller=new AbortController();sleeperPickController=controller;sleeperPickRequestInFlight=true;fetch('https://api.sleeper.app/v1/draft/'+SLEEPER_DRAFT_ID+'/picks?ts='+Date.now(),{cache:'no-store',signal:controller.signal}).then(function(response){if(!response.ok)throw new Error('Sleeper unavailable');return response.json()}).then(function(picks){if(requestId!==sleeperPickRequestSequence)return;let pickedKeys=new Set();picks.forEach(function(pick){sleeperPickKeys(pick).forEach(function(key){pickedKeys.add(key)})});let next=new Set();P.forEach(function(player,index){if(pickedKeys.has(canonicalName(player.player)))next.add(index)});sleeperDrafted=next;sleeperPickTotal=picks.length;sleeperInitialSyncPending=false;saveSleeperState();if(picks.length>0){sleeperDraftActive=true;startSleeperPickSync();setCurrentPick(sleeperPickTotal+1);syncStatus('Sleeper draft active · syncing','on')}else if(!sleeperDraftActive){setCurrentPick(0);syncStatus('Synced','on')}render()}).catch(function(error){if(requestId!==sleeperPickRequestSequence||error.name==='AbortError')return;sleeperInitialSyncPending=false;if(sleeperPickTotal>0)setCurrentPick(sleeperPickTotal+1);syncStatus('Offline — showing saved draft state','warn');render()}).finally(function(){if(requestId===sleeperPickRequestSequence){sleeperPickRequestInFlight=false;sleeperPickController=null}})}
function checkSleeperDraft(){if(!SLEEPER_DRAFT_ID){sleeperInitialSyncPending=false;setCurrentPick(0);syncStatus('No Sleeper draft connected','');render();return}if(sleeperSyncPaused){stopSleeperPickSync();stopSleeperStartWatch();setCurrentPick(0);syncStatus('Sleeper sync paused — connect the next draft above','');return}fetch('https://api.sleeper.app/v1/draft/'+SLEEPER_DRAFT_ID+'?ts='+Date.now(),{cache:'no-store'}).then(function(response){if(!response.ok)throw new Error('Sleeper unavailable');return response.json()}).then(function(draft){sleeperTeams=Number(draft.settings&&draft.settings.teams)||Object.keys(draft.draft_order||{}).length||sleeperTeams;if(draft.status==='drafting'){sleeperDraftActive=true;startSleeperPickSync();syncSleeperPicks()}else if(draft.status==='pre_draft'){sleeperDraftActive=false;stopSleeperPickSync();startSleeperStartWatch();syncSleeperPicks()}else{sleeperDraftActive=false;stopSleeperPickSync();stopSleeperStartWatch();sleeperInitialSyncPending=false;setCurrentPick(0);syncStatus('Synced','on');render()}}).catch(function(){sleeperDraftActive=false;stopSleeperPickSync();stopSleeperStartWatch();sleeperInitialSyncPending=false;if(sleeperPickTotal>0)setCurrentPick(sleeperPickTotal+1);syncStatus('Offline — showing saved draft state','warn');render()})}
let S;try{S=JSON.parse(localStorage.getItem(DRAFT_STATE_KEY)||'{"d":{},"h":[]}')}catch(error){S={d:{},h:[]}}let view='available',positionFilter='';
function togglePosition(position){positionFilter=positionFilter===position?'':position;render()}
const save=()=>localStorage.setItem(DRAFT_STATE_KEY,JSON.stringify(S));
function pick(i){if(isDrafted(i))return;S.d[i]=true;S.h.push(i);save();render()}
function restore(i){if(sleeperDrafted.has(i))return;delete S.d[i];S.h=S.h.filter(x=>x!==i);save();render()}
function undo(){let i=S.h.pop();if(i===undefined)return;delete S.d[i];save();render()}
function resetAll(){if(confirm('Reset all draft picks?')){S={d:{},h:[]};sleeperDrafted=new Set();sleeperPickTotal=0;saveSleeperState();sleeperSyncPaused=true;sleeperDraftActive=false;stopSleeperPickSync();setCurrentPick(0);syncStatus('Board reset · send the next draft link to reconnect','');save();render()}}
function e(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function f(x){if(x==null||x==='')return '—';return Number(x).toFixed(Number(x)%1?2:0)}
function render(){
 if(sleeperInitialSyncPending){document.getElementById('list').innerHTML='<div class="empty">Connecting to Sleeper…</div>';return}
 ['a','d'].forEach(x=>document.getElementById('t'+x).classList.remove('on'));
 document.getElementById(view==='available'?'ta':'td').classList.add('on');
 ['QB','RB','WR','TE'].forEach(function(position){let button=document.getElementById('f'+position),active=positionFilter===position;button.classList.toggle('on',active);button.setAttribute('aria-pressed',active)});
 let o='';
 P.forEach((p,i)=>{let st=isDrafted(i),pos=positionFor(p.player),pc=pos.toLowerCase(),emblem=emblemsFor(p.player);if(positionFilter&&pos!==positionFilter)return;if(view==='available'&&st)return;if(view==='drafted'&&!st)return;
 let acts=st?(sleeperDrafted.has(i)?'<button class="btn restore" disabled>Drafted in Sleeper</button>':'<button class="btn restore" onclick="restore('+i+')">Restore to Available</button>'):'<button class="btn draft" onclick="pick('+i+')">Drafted</button>';
 o+='<div class="card pos-'+pc+'"><div class="top"><div class="rank">'+(i+1)+'</div><div class="name">'+e(p.player)+'</div>'+emblem+'<div class="avg">AVG '+f(p.avg)+'</div></div><div class="details">Silva '+f(p.silva)+' &nbsp;·&nbsp; ETR '+f(p.etr)+' &nbsp;·&nbsp; JJ '+f(p.jj)+'</div><div class="actions">'+acts+'</div></div>'});
 document.getElementById('list').innerHTML=o||'<div class="empty">No players found.</div>';
}updateDraftControls();render();checkSleeperDraft();setInterval(function(){if(!sleeperDraftActive)checkSleeperDraft()},10000);let resumeRefreshTimer=null;function refreshOnReturn(){if(document.hidden)return;clearTimeout(resumeRefreshTimer);syncSleeperPicks(true);if(!sleeperDraftActive)checkSleeperDraft();resumeRefreshTimer=setTimeout(function(){syncSleeperPicks(true)},750)}document.addEventListener('visibilitychange',refreshOnReturn);window.addEventListener('focus',refreshOnReturn);window.addEventListener('pageshow',refreshOnReturn);window.addEventListener('online',refreshOnReturn);
</script></body></html>
